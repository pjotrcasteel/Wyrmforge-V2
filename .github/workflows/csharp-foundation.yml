name: V2 C# foundation checks
on:
  push:
    branches: [main, architecture/native-mobile-engine-blueprint]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Verify new engine project dependency rules
        run: python3 scripts/validate-engine-references.py
      - name: Guard HEX-only presentation assets
        run: python3 scripts/validate-hex-only.py
      - name: Restore
        run: dotnet restore Wyrmforge.V2.slnx
      - name: Build new C# engine solution
        run: dotnet build Wyrmforge.V2.slnx --no-restore --configuration Release
      - name: Test new C# engine contract foundation
        run: dotnet test game/tests/Wyrmforge.V2.Foundation.Tests/Wyrmforge.V2.Foundation.Tests.csproj --no-restore --configuration Release
