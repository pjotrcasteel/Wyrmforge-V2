name: V2 tests and independent Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: v2-pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run independent V2 unit tests
        run: node --test tests/*.test.mjs
      - name: Check V2-only imports
        run: |
          ! grep -R -nE '(Wyrmforge\.Presentation|/experimental/voxel/|/art/|/assets/|\.\./\.\./Wyrmforge)' --include='*.mjs' src main.mjs tests
      - name: Verify static entry
        run: test -s index.html && test -s main.mjs && test -s src/voxel-world.mjs
      - name: Validate JavaScript syntax
        run: |
          node --check main.mjs
          node --check src/voxel-world.mjs
          node --check tests/voxel-world.test.mjs
          node --check src/build-info.mjs
          node --check scripts/write-build-info.mjs
          node --check src/frame-metrics.mjs
          node --check tests/frame-metrics.test.mjs
          node --check src/pointer-gestures.mjs
          node --check tests/pointer-gestures.test.mjs
          node --check scripts/benchmark-chunks.mjs
      - name: Run independent 16-vs-32 storage benchmark
        run: node scripts/benchmark-chunks.mjs > chunk-comparison.json

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Stamp exact deployed commit
        run: node scripts/write-build-info.mjs
      - name: Verify build stamp
        run: node --input-type=module -e "import { COMMIT } from './src/build-info.mjs'; if (COMMIT !== process.env.GITHUB_SHA) process.exit(1)"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
