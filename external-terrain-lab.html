<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wyrmforge V2 — External 3D Terrain Handoff</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#101820;color:#e7edf1;font:14px system-ui}
body{display:flex;flex-direction:column;min-height:0;height:100dvh}
header{padding:10px 12px;background:#1d2b35;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
h1{font-size:16px;margin:0}a{color:#c4ddec}small{color:#abc3ce}
#build{margin-left:auto;font:11px ui-monospace,monospace}
main{flex:1;min-height:0;position:relative}
canvas{width:100%;height:100%;display:block;image-rendering:pixelated;touch-action:none}
#controls{padding:12px;background:#1c2e38;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
button,select{border:1px solid #748e9e;border-radius:7px;background:#355264;color:#fff;padding:10px;font:inherit}
button:disabled{opacity:.5}
#status{margin:0;flex:1 1 100%;min-height:18px;font:12px ui-monospace,monospace;color:#b8dec7}
footer{padding:6px 12px;color:#b6cbd8;font-size:11px;background:#101820}
</style>
</head>
<body>
<header>
<h1>V2.6 — External 3D terrain</h1>
<small>Actual WebGL2 / voxel authority · fixed engineering fixture</small>
<span id="build">Build loading…</span>
<a href="./index.html">Main voxel lab</a>
</header>
<main><canvas id="site-view" aria-label="Real externally initialized voxel site with stone span and grassy ground"></canvas></main>
<section id="controls" aria-label="External terrain demonstration">
<label for="view-camera">View</label>
<select id="view-camera" aria-label="Terrain viewing angle">
  <option value="inspection" selected>3D inspection (default)</option>
  <option value="hunt">Hunt camera (candidate)</option>
</select>
<label for="chunk-edge">Chunk pitch</label>
<select id="chunk-edge"><option value="16">16³</option><option value="32" selected>32³</option></select>
<button id="reset-site" type="button">Reload external site</button>
<button id="breach-site" type="button" disabled>Break stone span</button>
<p id="status" role="status" aria-live="polite">Preparing bounded V2 terrain initialization…</p>
</section>
<footer>V2.6 integration proof only: deterministic input, placeholder colors, no V2.8 biome generation or game art.</footer>
<script type="module" src="./external-terrain-lab.mjs"></script>
</body>
</html>
